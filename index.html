<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Budget Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-wallet"></i> Budget Tracker</h1>
            <div class="date-display">
                <span id="currentDate"></span>
            </div>
        </header>

        <div class="dashboard">
            <!-- Budget Summary Cards -->
            <div class="summary-cards">
                <div class="card income-card">
                    <div class="card-header">
                        <h3><i class="fas fa-arrow-up"></i> Total Income</h3>
                    </div>
                    <div class="card-body">
                        <span class="amount" id="totalIncome">$0.00</span>
                    </div>
                </div>
                
                <div class="card expense-card">
                    <div class="card-header">
                        <h3><i class="fas fa-arrow-down"></i> Total Expenses</h3>
                    </div>
                    <div class="card-body">
                        <span class="amount" id="totalExpenses">$0.00</span>
                    </div>
                </div>
                
                <div class="card balance-card">
                    <div class="card-header">
                        <h3><i class="fas fa-balance-scale"></i> Net Balance</h3>
                    </div>
                    <div class="card-body">
                        <span class="amount" id="netBalance">$0.00</span>
                    </div>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="charts-section">
                <div class="chart-container">
                    <h3><i class="fas fa-chart-pie"></i> Expense Categories</h3>
                    <canvas id="expenseChart"></canvas>
                </div>
                <div class="chart-container">
                    <h3><i class="fas fa-chart-line"></i> Monthly Trend</h3>
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <!-- Transaction Forms -->
            <div class="forms-section">
                <div class="form-container">
                    <h3><i class="fas fa-plus-circle"></i> Add Income</h3>
                    <form id="incomeForm">
                        <div class="form-group">
                            <input type="text" id="incomeDescription" placeholder="Description" required>
                        </div>
                        <div class="form-group">
                            <input type="number" id="incomeAmount" placeholder="Amount" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <input type="date" id="incomeDate" required>
                        </div>
                        <button type="submit" class="btn btn-income">
                            <i class="fas fa-plus"></i> Add Income
                        </button>
                    </form>
                </div>

                <div class="form-container">
                    <h3><i class="fas fa-minus-circle"></i> Add Expense</h3>
                    <form id="expenseForm">
                        <div class="form-group">
                            <input type="text" id="expenseDescription" placeholder="Description" required>
                        </div>
                        <div class="form-group">
                            <input type="number" id="expenseAmount" placeholder="Amount" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <select id="expenseCategory" required>
                                <option value="">Select Category</option>
                                <option value="food">Food & Dining</option>
                                <option value="transportation">Transportation</option>
                                <option value="entertainment">Entertainment</option>
                                <option value="utilities">Utilities</option>
                                <option value="healthcare">Healthcare</option>
                                <option value="shopping">Shopping</option>
                                <option value="education">Education</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <input type="date" id="expenseDate" required>
                        </div>
                        <button type="submit" class="btn btn-expense">
                            <i class="fas fa-minus"></i> Add Expense
                        </button>
                    </form>
                </div>
            </div>

            <!-- Budget Goals Section -->
            <div class="goals-section">
                <div class="goal-container">
                    <h3><i class="fas fa-target"></i> Monthly Budget Goals</h3>
                    <div class="goal-form">
                        <input type="number" id="monthlyBudget" placeholder="Set Monthly Budget" step="0.01">
                        <button id="setBudgetBtn" class="btn btn-primary">
                            <i class="fas fa-check"></i> Set Goal
                        </button>
                    </div>
                    <div class="budget-progress" id="budgetProgress" style="display: none;">
                        <div class="progress-info">
                            <span>Budget: <span id="budgetAmount">$0</span></span>
                            <span>Spent: <span id="spentAmount">$0</span></span>
                            <span>Remaining: <span id="remainingAmount">$0</span></span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Transactions History -->
            <div class="transactions-section">
                <div class="section-header">
                    <h3><i class="fas fa-history"></i> Recent Transactions</h3>
                    <div class="filter-controls">
                        <select id="filterType">
                            <option value="all">All Transactions</option>
                            <option value="income">Income Only</option>
                            <option value="expense">Expenses Only</option>
                        </select>
                        <select id="filterPeriod">
                            <option value="all">All Time</option>
                            <option value="thisMonth">This Month</option>
                            <option value="lastMonth">Last Month</option>
                            <option value="thisYear">This Year</option>
                        </select>
                    </div>
                </div>
                <div class="transactions-list" id="transactionsList">
                    <div class="empty-state">
                        <i class="fas fa-receipt"></i>
                        <p>No transactions yet. Start by adding some income or expenses!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
